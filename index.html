<!DOCTYPE html>
<html lang = "eng">
    <head>
        <meta charset = "UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title = "FDP"></title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    </head>
    <body>
        <div class="big-container">
            <div class="little-container">
                <img id="main-image" src="example.jpeg">
                <div class="mini-container">
                <h2>FDP</h2>
                <hr>
                <br>
                <div class="info">
                    <div class="mini-info">
                        <div class = "mini-title">
                            <img src="clock.png" class="icon">
                            <h4>WHEN</h4>
                        </div>
                        <h3>29/05/2026</h3>
                    </div>
                    <div class="mini-info">
                        <div class = "mini-title">
                            <img src="location.png" class="icon">
                            <h4>WHERE</h4>
                        </div>
                        <h3>-</h3>
                    </div>
                    <div class="mini-info">
                        <div class = "mini-title">
                            <img src="dollar.png" class="icon">
                            <h4>PRICE</h4>
                        </div>
                        <h3>ARS$17000</h3>
                    </div>
                    <div class="mini-info">
                        <div class = "mini-title">
                            <img src="champange.png" class="icon">
                            <h4>OPEN BAR</h4>
                        </div>
                        <h3>No Charge</h3>
                    </div>
                    <br>
                </div>
                </div>
                <br>
                <button id="buy">BUY YOUR TICKET</button>
            <br>
        </div>
        <br>
        <div class="map-container">
            <h3>How To Get There</h3>
            <hr>
            <div id="map">

            </div>
        </div>
    </body>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</html>
